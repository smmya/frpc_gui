name: Build frpC

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - "v*"                  # 打 tag 时自动构建并发布 Release
  pull_request:               # PR 时仅构建验证（不发 Release）

permissions:
  contents: write             # 允许创建 GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: frpC-windows-amd64
          - os: ubuntu-24.04        # 当前 ubuntu-latest；含 webkit2gtk-4.1 + libgirepository-2.0
            platform: linux
            artifact: frpC-linux-amd64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"            # 强制 Python UTF-8 模式，避免 Windows runner 的 cp1252 代码页导致中文 print 崩溃
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Linux：pywebview gtk 后端优先 WebKit2 4.1（回退 4.0），24.04 提供 4.1 + girepository-2.0
      - name: Install Linux GUI deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            gir1.2-webkit2-4.1 gir1.2-gtk-3.0 \
            libgirepository-2.0-dev libcairo2-dev python3-dev pkg-config

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pyinstaller==6.22.2 pytest
          if [ "${{ matrix.platform }}" = "windows" ]; then
            python -m pip install pythonnet==3.1.0 clr_loader==0.3.1
          else
            # ubuntu-24.04 提供 libgirepository-2.0，直接用最新 PyGObject（无需降级）
            python -m pip install pygobject
          fi

      - name: Fetch frpc binary
        run: python scripts/fetch_frpc.py --platform ${{ matrix.platform }}

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build with PyInstaller
        run: python -m PyInstaller frpC.spec --noconfirm --clean

      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv dist/frpC.exe "dist/${{ matrix.artifact }}.exe"
          else
            mv dist/frpC "dist/${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/frpC-*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
